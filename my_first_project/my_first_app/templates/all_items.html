{% extends "master.html" %}

{% block title %}
    All Items
{% endblock %}

{% block content %}
    <h1>Item</h1>
    
    <ul>
        {% for x in myitems %}
            <li><a href="details/{{ x.id }}">{{ x.name }}  {{ x.lastname }}  {{ x.description }} {{ x.hobby }} {{ x.phone }} </a></li>
        {% endfor %}
    </ul>
{% endblock %}
