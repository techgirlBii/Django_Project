<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Dashboard{% endblock %}</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    /* Layout */
    .layout {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .header a {
      text-decoration: none;
      color: #2563eb;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Cards */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      margin-bottom: 24px;
      border: 1px solid #e5e7eb;
    }

    .card h3 {
      margin-bottom: 8px;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .card p {
      color: #4b5563;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    /* Back button */
    .back-wrapper {
      margin-top: 40px;
      text-align: right;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: #2563eb;
      color: #ffffff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .back-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="layout">
    {% block content %}
    {% endblock %}
  </div>

</body>
</html>
